name: Keepalive

# 每 5 分钟 ping 一次 Orkestr 上的机器人，防止免费档空闲休眠
# （公开仓库的 GitHub Actions 免费且不限时长）
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping QQ bot health endpoint
        run: |
          curl -fsS -m 30 --retry 3 --retry-delay 10 "https://qq-official-bot.orkestr.run/" \
            || curl -fsS -m 30 "https://qq-official-bot.orkestr.run/"
